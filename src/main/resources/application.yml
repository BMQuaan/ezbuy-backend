spring:
  application:
    name: ezbuy

  datasource:
    url: jdbc:mysql://localhost:3306/ezbuy
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # jackson:
  #   time-zone: Asia/Ho_Chi_Minh

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: "http://localhost:3000"
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
server:
  port: 8081

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

ai:
  classification:
    service:
      url: http://localhost:8000/api/predict

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  currency: ${VNPAY_CURRENCY:USD}
  return-url: ${FRONTEND_URL:http://localhost:3000}/payment/vnpay-return
  ipn-url: ${BACKEND_URL:http://localhost:8081}/api/payments/vnpay-ipn

