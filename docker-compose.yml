
services:
  # ==========================================
  # 1. MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0.42
    container_name: ezbuy-mysql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ezbuy
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically initializes the database schema and sample data on initial container creation
      - ./database/ezbuy_database.sql:/docker-entrypoint-initdb.d/ezbuy_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ezbuy-network

  # ==========================================
  # 2. Redis In-Memory Cache & Lock Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ezbuy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezbuy-network

  # ==========================================
  # 3. Spring Boot Backend Service
  # ==========================================
  spring-app:
    container_name: ezbuy-spring-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ezbuy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEFAULT_STOCK_STRATEGY: ${DEFAULT_STOCK_STRATEGY:-ATOMIC_SQL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ezbuy-network

volumes:
  mysql-data:
    name: ezbuy-mysql-data
  redis-data:
    name: ezbuy-redis-data

networks:
  ezbuy-network:
    name: ezbuy-network
    driver: bridge
